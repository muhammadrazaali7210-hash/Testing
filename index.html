<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Diagnostics Mode</title>
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .header-title { color: var(--accent-cyan); font-size: 1.8rem; margin-bottom: 5px; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .header-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; text-align: center; }
        .engine-container { background: var(--panel-dark); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .upload-zone { border: 2px dashed var(--accent-blue); border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; background: rgba(59, 130, 246, 0.05); }
        .terminal-log { margin-top: 20px; padding: 12px; background: #000; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #10b981; text-align: center; border: 1px solid #10b981; }
    </style>
</head>
<body>

    <div class="header-title">JARVIS DIAGNOSTICS</div>
    <div class="header-sub">UI Memory Test</div>

    <div class="engine-container">
        <div class="upload-zone">
            <p>UI Loaded Successfully</p>
        </div>
        <div class="terminal-log">Awaiting test results, sir.</div>
    </div>

</body>
</html>
