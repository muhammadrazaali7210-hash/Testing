<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Local Processing Core v4.0</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header-title {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }

        .header-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .engine-container {
            background: var(--panel-dark);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .upload-zone {
            border: 2px dashed var(--accent-blue);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(59, 130, 246, 0.05);
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-zone:hover {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.1);
        }

        #file-input { display: none; }

        .file-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border-left: 3px solid var(--accent-cyan);
            font-size: 0.85rem;
            display: none;
            max-height: 120px;
            overflow-y: auto;
        }

        .selector-group { margin-top: 20px; }
        
        .selector-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }

        /* --- NEW PROGRESS METRIC GRAPHICS --- */
        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--bg-dark);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
            transition: width 0.1s ease;
        }

        .btn-execute {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
            transition: 0.2s;
        }

        .btn-execute:active { transform: scale(0.98); }

        .terminal-log {
            margin-top: 20px;
            padding: 12px;
            background: #000;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #10b981;
            min-height: 40px;
            text-align: center;
            border: 1px solid #10b981;
        }

        .terminal-error { color: #ef4444; border-color: #ef4444; }
        .terminal-info { color: var(--accent-cyan); border-color: var(--accent-cyan); }
        .terminal-success { color: var(--success); border-color: var(--success); }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="header-title">JARVIS QUANTUM CORE</div>
    <div class="header-sub">Multi-File Processing & Telemetry Array</div>

    <div class="engine-container">
        <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <p>Tap to Initialize Target Asset Streams (Max 30)</p>
        </div>
        <input type="file" id="file-input" multiple>

        <div class="file-info" id="file-info">
            <strong>Active Asset Count:</strong> <span id="asset-count">0 File(s)</span><br>
            <strong>Total Queue Mass:</strong> <span id="file-size">0 KB</span>
            <div id="file-list-preview" style="margin-top: 8px; font-size: 0.75rem; color: var(--text-muted);"></div>
        </div>

        <div class="selector-group">
            <label>Select Target Batch Translation Protocol</label>
            <select id="format-selector">
                <optgroup label="Images (Canvas API Binary Matrix)">
                    <option value="png" selected>PNG (Lossless Matrix Image)</option>
                    <option value="jpg">JPG (Compressed Matrix Image)</option>
                    <option value="webp">WEBP (Modern Web Image)</option>
                </optgroup>
                <optgroup label="Documents (Structural XML/Vector Layouts)">
                    <option value="pdf">PDF (True Vector Adobe Layout)</option>
                    <option value="docx">DOCX (OpenXML Word Document)</option>
                    <option value="pptx">PPTX (OpenXML Presentation Slide)</option>
                    <option value="txt">TXT (Raw Plain Text Stream)</option>
                </optgroup>
                <optgroup label="Media (FFmpeg WebAssembly Core)">
                    <option value="mp3">MP3 (True Audio Layer Rewrite)</option>
                    <option value="m4a">M4A (AAC Audio Container)</option>
                    <option value="wav">WAV (Uncompressed Audio PCM)</option>
                    <option value="mp4">MP4 (True H.264 Video Encode)</option>
                    <option value="mkv">MKV (Matroska Media Container)</option>
                </optgroup>
            </select>
        </div>

        <div class="progress-container" id="progress-panel">
            <div class="progress-labels">
                <span id="progress-status">Processing queue...</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar-fill"></div>
            </div>
        </div>

        <button class="btn-execute" onclick="executeBatchConversion()">Compile & Execute Batch</button>

        <div class="terminal-log terminal-info" id="terminal">System Standing By, sir.</div>
    </div>

    <canvas id="render-canvas"></canvas>

    <script>
        let assetBatchQueue = [];
        const terminal = document.getElementById('terminal');
        const progressPanel = document.getElementById('progress-panel');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressStatus = document.getElementById('progress-status');

        if (window['pdfjs-dist/build/pdf']) {
            window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc = '';
        }

        function logToTerminal(message, type = "info") {
            terminal.innerText = message;
            terminal.className = `terminal-log terminal-${type}`;
        }

        function updateProgressBar(percentage, statusText) {
            progressPanel.style.display = "block";
            progressBarFill.style.width = `${percentage}%`;
            progressPercentage.innerText = `${Math.round(percentage)}%`;
            if (statusText) progressStatus.innerText = statusText;
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                // Enforce a safe hardware boundary limit of 30 files
                assetBatchQueue = Array.from(e.target.files).slice(0, 30);
                
                let totalSize = 0;
                let listHtml = "";
                assetBatchQueue.forEach(f => {
                    totalSize += f.size;
                    listHtml += `• ${f.name}<br>`;
                });

                document.getElementById('asset-count').innerText = `${assetBatchQueue.length} File(s) loaded`;
                document.getElementById('file-size').innerText = (totalSize / 1024).toFixed(2) + " KB";
                document.getElementById('file-list-preview').innerHTML = listHtml;
                document.getElementById('file-info').style.display = "block";
                
                progressPanel.style.display = "none";
                progressBarFill.style.width = "0%";
                
                logToTerminal(`${assetBatchQueue.length} assets verified in processing ledger, sir.`, "success");
            }
        });

        async function executeBatchConversion() {
            if (assetBatchQueue.length === 0) return logToTerminal("Error: Processing queue buffer is empty, sir.", "error");
            
            const targetFormat = document.getElementById('format-selector').value;
            const totalFiles = assetBatchQueue.length;
            
            logToTerminal(`Initializing batch array loop execution for ${totalFiles} assets...`, "info");
            updateProgressBar(0, `Starting batch execution...`);

            for (let i = 0; i < totalFiles; i++) {
                const currentAsset = assetBatchQueue[i];
                const originalName = currentAsset.name.split('.')[0];
                const fileType = currentAsset.type || currentAsset.name.toLowerCase();
                const baseProgress = (i / totalFiles) * 100;
                
                updateProgressBar(baseProgress, `Processing [${i+1}/${totalFiles}]: ${currentAsset.name}`);
                logToTerminal(`Compiling file data cell ${i+1} of ${totalFiles}: ${currentAsset.name}`, "info");

                try {
                    // Pipeline routing logic tracking individual loops safely
                    if ((fileType.includes('pdf') || currentAsset.name.toLowerCase().endsWith('.pdf')) && ['png', 'jpg', 'webp'].includes(targetFormat)) {
                        await processPdfToImageLocally(currentAsset, targetFormat, originalName);
                    }
                    else if (['png', 'jpg', 'webp'].includes(targetFormat)) {
                        await processImageLocally(currentAsset, targetFormat, originalName);
                    } 
                    else if (targetFormat === 'pdf') {
                        await processPdfLocally(currentAsset, originalName);
                    } 
                    else if (['docx', 'pptx', 'txt'].includes(targetFormat)) {
                        if (targetFormat === 'txt') {
                            if (fileType.includes('image')) {
                                logToTerminal(`Skipping ${currentAsset.name}: Image to text conversion matches zero plaintext strings.`, "error");
                                continue;
                            }
                            await processTxtLocally(currentAsset, originalName);
                        } else {
                            await processOfficeXmlLocally(currentAsset, targetFormat, originalName);
                        }
                    } 
                    else if (['mp3', 'm4a', 'wav', 'mp4', 'mkv'].includes(targetFormat)) {
                        // Monitor inner media engine telemetry strings inside loop
                        await processMediaLocally(currentAsset, targetFormat, originalName, (innerPct) => {
                            const combinedProgress = baseProgress + (innerPct / totalFiles);
                            updateProgressBar(combinedProgress, `Encoding media stack: ${Math.round(innerPct)}%`);
                        });
                    }
                } catch (error) {
                    console.error(error);
                    logToTerminal(`Exception caught on loop node ${currentAsset.name}. Advancing queue...`, "error");
                }
                
                // Set step end percentage coordinates
                updateProgressBar(((i + 1) / totalFiles) * 100);
            }

            updateProgressBar(100, "Batch complete!");
            logToTerminal(`All ${totalFiles} target operations fully processed, sir!`, "success");
        }

        // PIPELINE 1: IMAGE COMPILER
        function processImageLocally(file, format, baseName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('render-canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        
                        let mime = 'image/png';
                        if (format === 'jpg') mime = 'image/jpeg';
                        if (format === 'webp') mime = 'image/webp';

                        canvas.toBlob((blob) => {
                            if (!blob) return reject("Blob failure");
                            triggerDownload(URL.createObjectURL(blob), `${baseName}.${format}`);
                            resolve();
                        }, mime, 0.95);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // PIPELINE 2: PDF GRAPHIC SLICER
        function processPdfToImageLocally(file, targetFormat, originalName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    window['pdfjs-dist/build/pdf'].getDocument({
                        data: new Uint8Array(e.target.result)
                    }).promise.then(function(pdf) {
                        pdf.getPage(1).then(function(page) {
                            const canvas = document.getElementById('render-canvas');
                            const ctx = canvas.getContext('2d');
                            const viewport = page.getViewport({ scale: 2.0 });
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            
                            const renderContext = { canvasContext: ctx, viewport: viewport };
                            page.render(renderContext).promise.then(function() {
                                let mime = 'image/png';
                                if (targetFormat === 'jpg') mime = 'image/jpeg';
                                if (targetFormat === 'webp') mime = 'image/webp';

                                canvas.toBlob((blob) => {
                                    if (!blob) return reject();
                                    triggerDownload(URL.createObjectURL(blob), `${originalName}_page1.${targetFormat}`);
                                    resolve();
                                }, mime, 0.95);
                            });
                        });
                    }).catch(reject);
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // PIPELINE 3: VECTOR PDF EMBEDDER (Supports seamless PNG/JPG fallback layers)
        async function processPdfLocally(file, baseName) {
            const pdfDoc = await PDF
Lib.PDFDocument.create();
            const page = pdfDoc.addPage([600, 800]);
            const arrayBuffer = await file.arrayBuffer();
            const fileNameLower = file.name.toLowerCase();
            
            const isImage = file.type.includes('image') || 
                            ['png', 'jpg', 'jpeg', 'webp'].some(ext => fileNameLower.endsWith(ext));

            if (isImage) {
                let imageEmbed;
                if (fileNameLower.endsWith('.png')) {
                    imageEmbed = await pdfDoc.embedPng(arrayBuffer);
                } else {
                    imageEmbed = await pdfDoc.embedJpg(arrayBuffer);
                }
                const ratio = Math.min(500 / imageEmbed.width, 700 / imageEmbed.height);
                const w = imageEmbed.width * ratio;
                const h = imageEmbed.height * ratio;
                page.drawImage(imageEmbed, { x: 50, y: 800 - h - 50, width: w, height: h });
            } else {
                const text = await file.text();
                page.drawText(text.substring(0, 2000), { x: 50, y: 750, size: 12, maxWidth: 500 });
            }

            const pdfBytes = await pdfDoc.save();
            triggerDownload(URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' })), `${baseName}.pdf`);
        }

        // PIPELINE 4: OFFICE ARCHIVE STRUCTURAL XML PACKAGER
        async function processOfficeXmlLocally(file, format, baseName) {
            const text = await file.text();
            const safeText = text.replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','\'':'&apos;','"':'&quot;'}[c] || c));
            const zip = new JSZip();
            
            if (format === 'docx') {
                zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
                zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
                zip.folder("word").file("document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>${safeText}</w:t></w:r></w:p></w:body></w:document>`);
            } else if (format === 'pptx') {
                zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/unpacked/slide.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/></Types>`);
                zip.folder("unpacked").file("slide.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld><p:spTree><p:sp><p:txBody><a:bodyPr/><a:p><a:r><a:t>${safeText}</a:t></a:r></a:p></p:txBody></p:sp></p:spTree></p:cSld></p:sld>`);
            }

            const content = await zip.generateAsync({ type: "blob" });
            const mimeType = format === 'docx' ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
            triggerDownload(URL.createObjectURL(new Blob([content], {type: mimeType})), `${baseName}.${format}`);
        }

        // PIPELINE 5: TEXT STREAM SHEET WRITER
        async function processTxtLocally(file, baseName) {
            const text = await file.text();
            triggerDownload(URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' })), `${baseName}.txt`);
        }

        // PIPELINE 6: TELEMETRY-AWARE MEDIA TRANSCODER (FFMPEG)
        async function processMediaLocally(file, targetFormat, originalName, progressCallback) {
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ log: false, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
            
            await ffmpeg.load();
            
            ffmpeg.setProgress(({ ratio }) => {
                if (ratio >= 0 && ratio <= 1) {
                    progressCallback(ratio * 100);
                }
            });

            const inName = 'input.' + file.name.split('.').pop();
            const outName = `output.${targetFormat}`;
            const fileType = file.type || file.name.toLowerCase();
            
            ffmpeg.FS('writeFile', inName, await fetchFile(file));
            
            const isAudioInput = fileType.includes('audio') || ['mp3', 'wav', 'm4a', 'ogg'].some(ext => file.name.toLowerCase().endsWith(ext));
            const isVideoOutput = ['mp4', 'mkv'].includes(targetFormat);

            if (isAudioInput && isVideoOutput) {
                await ffmpeg.run('-f', 'lavfi', '-i', 'color=c=black:s=640x480:r=30', '-i', inName, '-c:v', 'libx264', '-tune', 'stillimage', '-c:a', 'aac', '-b:a', '128k', '-pix_fmt', 'yuv420p', '-shortest', outName);
            } else {
                await ffmpeg.run('-i', inName, outName);
            }
            
            const data = ffmpeg.FS('readFile', outName);
            
            let mime = 'video/mp4';
            if (targetFormat === 'mp3') mime = 'audio/mpeg';
            if (targetFormat === 'm4a') mime = 'audio/mp4';
            if (targetFormat === 'wav') mime = 'audio/wav';
            if (targetFormat === 'mkv') mime = 'video/x-matroska';

            triggerDownload(URL.createObjectURL(new Blob([data.buffer], { type: mime })), `${originalName}.${targetFormat}`);
            
            ffmpeg.FS('unlink', inName);
            ffmpeg.FS('unlink', outName);
        }

        // UTILITY: SYSTEM DOWNLOAD MATRIX
        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
