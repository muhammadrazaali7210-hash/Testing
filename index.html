<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Master Processing Core</title>
    
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root { --bg-dark: #0f172a; --panel-dark: #1e293b; --accent-cyan: #22d3ee; --accent-blue: #3b82f6; --text-light: #f8fafc; --text-muted: #94a3b8; --success: #10b981; --error: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .engine-container { background: var(--panel-dark); border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .upload-zone { display: block; border: 2px dashed var(--accent-blue); border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; background: rgba(59, 130, 246, 0.05); }
        #file-input { display: none; }
        .btn-execute { width: 100%; margin-top: 20px; padding: 14px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .terminal-log { margin-top: 20px; padding: 12px; background: #000; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #10b981; text-align: center; border: 1px solid #10b981; }
    </style>
</head>
<body>

    <div class="engine-container">
        <label class="upload-zone" for="file-input">Select Asset to Process</label>
        <input type="file" id="file-input" multiple>
        
        <select id="format-selector" style="width:100%; padding:10px; margin-top:15px; background: #0f172a; color: white;">
            <option value="png">Image: PNG</option>
            <option value="jpg">Image: JPG</option>
            <option value="pdf">PDF: Combine Images</option>
            <option value="mp3">Audio: MP3</option>
            <option value="mp4">Video: MP4</option>
        </select>
        
        <button class="btn-execute" onclick="executeBatchConversion()">Run Process</button>
        <div class="terminal-log" id="terminal">System Ready, sir.</div>
    </div>

    <script>
        // CORE: FORCED DOWNLOADER (Android WebView Compatible)
        function triggerDownload(blob, filename) {
            const reader = new FileReader();
            reader.onloadend = function() {
                const base64data = reader.result;
                const a = document.createElement('a');
                a.href = base64data;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            reader.readAsDataURL(blob);
        }

        // FFmpeg Core Execution
        async function processMedia(file, format, name) {
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
            await ffmpeg.load();
            
            ffmpeg.FS('writeFile', 'in', await fetchFile(file));
            await ffmpeg.run('-i', 'in', `out.${format}`);
            const data = ffmpeg.FS('readFile', `out.${format}`);
            
            triggerDownload(new Blob([data.buffer], { type: 'application/octet-stream' }), `${name}.${format}`);
            ffmpeg.FS('unlink', 'in');
            ffmpeg.FS('unlink', `out.${format}`);
        }

        async function executeBatchConversion() {
            const files = document.getElementById('file-input').files;
            const format = document.getElementById('format-selector').value;
            if (files.length === 0) return alert("No file selected.");

            document.getElementById('terminal').innerText = "Processing...";
            
            if (format === 'pdf') {
                // Simplified PDF logic
                const pdfDoc = await PDFLib.PDFDocument.create();
                for (let f of files) {
                    const bytes = await f.arrayBuffer();
                    const img = await pdfDoc.embedPng(bytes).catch(() => pdfDoc.embedJpg(bytes));
                    const page = pdfDoc.addPage();
                    page.drawImage(img);
                }
                const pdfBytes = await pdfDoc.save();
                triggerDownload(new Blob([pdfBytes], { type: 'application/pdf' }), "JARVIS_Output.pdf");
            } else {
                await processMedia(files[0], format, "JARVIS_Output");
            }
            
            document.getElementById('terminal').innerText = "Complete, sir!";
        }
    </script>
</body>
</html>
